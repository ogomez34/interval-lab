server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Always revalidate with the origin before serving a cached copy. This
    # app has no content-hashed/versioned filenames, so without this,
    # Cloudflare's default edge caching (and browser caching) can keep
    # serving a stale index.html/js/css for hours after a deploy.
    # "no-cache" still allows conditional GETs (ETag/Last-Modified -> 304),
    # it just forbids using a cached copy without checking first.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
